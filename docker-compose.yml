# docker-compose.yml

services:
  fastapi:
    # ── Build ──────────────────────────────────────────────────────────────

    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:

        APP_VERSION: "0.1.0"

    image: mistral-inference-gateway:dev

    # ── Container name ───────────────────────
    container_name: mistral-fastapi-dev

    # ── Port mapping ─────────────────────

    ports:
      - "8000:8000"

    # ── Environment variables ───────────────────────

    environment:
      APP_ENV: development
      APP_VERSION: "0.1.0"
      LOG_LEVEL: DEBUG
      HOST: "0.0.0.0"
      PORT: "8000"
      WORKERS: "1"

      VLLM_BASE_URL: "http://localhost:8001"
      VLLM_MODEL_NAME: "mistralai/Mistral-7B-Instruct-v0.3"
      VLLM_TIMEOUT_SECONDS: "30"
      MAX_TOKENS_LIMIT: "4096"
      DEFAULT_MAX_TOKENS: "512"

    # ── Health check ───────────────────────────────────────────────────────

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    # ── Restart policy ─────────────────────────────────────────────────────

    restart: unless-stopped

    # ── Resource limits ────────────────────────────────────────────────────

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"

    # ── Read-only root filesystem ──────────────────────────────────────────

    read_only: true

    # ── Tmpfs mounts ───────────────────────────────────────────────────────

    tmpfs:
      - /tmp
      - /var/tmp
