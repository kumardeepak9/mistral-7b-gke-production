

name: CI — Lint, Test, Security Scan

on:
  pull_request:
    
    branches:
      - main
    
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/ci.yaml'

  
  workflow_dispatch:


permissions:
  contents: read
  security-events: write


concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:


 
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install linting tools
        
        run: pip install ruff==0.6.9 black==24.10.0

      - name: Run ruff (linter)
        run: ruff check app/ tests/ --output-format=github

      - name: Run black (formatter check)
        run: black --check app/ tests/

  # ============================================================================
  # JOB 2: Run Unit and Integration Tests with Coverage
  # ============================================================================

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Test-only dependencies
          pip install pytest==8.3.4 \
                      pytest-asyncio==0.24.0 \
                      httpx==0.28.1 \
                      pytest-cov==6.0.0

      - name: Run tests with coverage
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ \
              --cov=app \
              --cov-report=xml \
              --cov-report=term-missing \
              --cov-fail-under=70 \
              -v \
              --tb=short
          else
            echo "No tests/ directory found. Skipping pytest."
            echo "Create tests/ with pytest files to enable coverage enforcement."
          fi

      - name: Upload coverage report
        
        #   if: always() ensures coverage.xml is uploaded even if the coverage

        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7


  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
       
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          pull: true
         
          push: false
          tags: mistral-inference-gateway:pr-check
      
          cache-from: type=gha,scope=ci-docker-build
          cache-to: type=gha,mode=max,scope=ci-docker-build

  
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload scan results to GitHub Security tab
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
