

name: CD — Build, Push, Deploy

on:
  push:
    branches:
      - main
   
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/cd.yaml'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: true
        default: 'Manual deployment'

# ── Top-level environment variables ─────────────────────────────────────────

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_CLUSTER_REGION: ${{ secrets.GKE_CLUSTER_REGION }}
  REGION: ${{ secrets.GKE_CLUSTER_REGION }}
  ARTIFACT_REGISTRY_HOST: ${{ secrets.GKE_CLUSTER_REGION }}-docker.pkg.dev
  REPOSITORY: mistral-registry
  IMAGE_NAME: mistral-inference-gateway
  NAMESPACE: mistral-gateway
  DEPLOYMENT_NAME: fastapi
  CONTAINER_NAME: fastapi   

# ── Concurrency ──────────────────────────────────────────────────────────────

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================================

  build-and-push:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
   
    permissions:
      contents: read
      id-token: write


    outputs:
      image: ${{ steps.tag.outputs.image }}
      image-repository: ${{ steps.tag.outputs.image_repository }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
          GKE_CLUSTER_REGION: ${{ secrets.GKE_CLUSTER_REGION }}
        run: |
          for key in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GKE_CLUSTER_NAME GKE_CLUSTER_REGION; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done

      # ── Step 1: Authenticate to GCP via Workload Identity Federation ─────────
      - name: Authenticate to Google Cloud (WIF — no JSON key)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          
          token_format: access_token

      # ── Step 2: Validate the registry target before building ───────────────
      - name: Verify Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${{ env.REPOSITORY }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --location="${{ env.GKE_CLUSTER_REGION }}" \
            --format='value(name)'

      # ── Step 3: Configure Docker to authenticate with Artifact Registry ──────
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # ── Step 4: Set up Docker Buildx ─────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          
          driver-opts: |
            network=host

      # ── Step 5: Generate the image tag ────────────────────────────────────────
      - name: Generate image tag (commit SHA)
        id: tag
        run: |
          # WHY SHA-based tags?
          #   Semantic version tags (v1.2.3) require a tagging ceremony.
          #   SHA tags are:
          #     • Automatic — no human decision needed
          #     • Unique — each commit = distinct image
          #     • Traceable — kubectl describe pod → image SHA → git log → commit diff
          #     • Immutable — a SHA tag cannot be overwritten (unlike `latest`)

          # SHORT_SHA: first 12 characters of the 40-char commit SHA (lower collision risk)
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_REPOSITORY="${{ env.ARTIFACT_REGISTRY_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${IMAGE_REPOSITORY}:${SHORT_SHA}"

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "image_repository=${IMAGE_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          echo "Image tag: ${IMAGE}"

      # ── Step 5: Build and push ─────────────────────────────────────────────────
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          pull: true
          
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
          
          cache-from: type=gha,scope=cd-build
          cache-to: type=gha,mode=max,scope=cd-build

          
          provenance: true
          sbom: true

      - name: Print image digest (SHA256)
        run: |
          echo "Image:  ${{ steps.tag.outputs.image }}"
          echo "Repo:   ${{ steps.tag.outputs.image_repository }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"

  # ============================================================================
  # JOB 2: Scan the Container Image for Vulnerabilities
  
  scan-image:
    name: Scan Container Image (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push   

    permissions:
      contents: read
      id-token: write
      security-events: write   

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Scan image for CVEs
      
        uses: aquasecurity/trivy-action@0.28.0
        with:
         
          image-ref: ${{ needs.build-and-push.outputs.image-repository }}@${{ needs.build-and-push.outputs.image-digest }}
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          
          ignore-unfixed: true

      - name: Upload image scan results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-container-image

  # ============================================================================
  # JOB 3: Deploy to GKE — Rolling Update
 
  deploy:
    name: Deploy to GKE (Rolling Update)
    runs-on: ubuntu-latest
    
    needs: [build-and-push, scan-image]

    permissions:
      contents: read
      id-token: write

   
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Step 1: Authenticate to GCP ──────────────────────────────────────────
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ── Step 2: Get GKE credentials ───────────────────────────────────────────
      - name: Get GKE cluster credentials
      
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_CLUSTER_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ── Step 3: Pre-deployment verification ──────────────────────────────────
      - name: Verify cluster connection and current state
        run: |
          echo "=== Cluster connection ==="
          kubectl cluster-info --context=$(kubectl config current-context)

          echo ""
          echo "=== Current Deployment state ==="
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} \
            -o wide

          echo ""
          echo "=== Current Pods ==="
          kubectl get pods \
            -n ${{ env.NAMESPACE }} \
            -l app=${{ env.DEPLOYMENT_NAME }} \
            -o wide

          echo ""
          echo "=== Deployment rollout history ==="
          kubectl rollout history deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }}

      # ── Step 4: Rolling Update via kubectl set image ──────────────────────────
      - name: Rolling update — set new image
        id: rolling-update
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image-repository }}@${{ needs.build-and-push.outputs.image-digest }}"
          SHORT_SHA="${GITHUB_SHA::12}"

          echo "Deploying image: ${IMAGE}"
          echo "From commit:     ${GITHUB_SHA}"
          echo "Triggered by:    ${{ github.actor }}"

          # WHY `kubectl set image` and not `kubectl apply -f`?
          #   kubectl set image DEPLOYMENT/NAME CONTAINER=IMAGE:TAG
          #   It updates ONLY the image field of the Deployment — surgical, fast.
          #
          #   kubectl apply -f would re-apply the entire manifest.
          #   If the manifest still has the old image tag (0.1.0), it would
          #   UNDO the new deployment. We avoid this by using set image.
          #
          #   Production-grade alternative: Kustomize image patches or Helm --set
          #   which keep the manifests as the source of truth.
          #   For now, kubectl set image is correct, simple, and interview-ready.
          kubectl set image \
            deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.CONTAINER_NAME }}="${IMAGE}" \
            --namespace=${{ env.NAMESPACE }}

          # WHY annotate with change-cause?
          #   `kubectl rollout history` shows the change-cause annotation, making
          #   it easy to see what each revision deployed and why:
          #     REVISION  CHANGE-CAUSE
          #     1         Initial deployment
          #     2         CI/CD: SHA=a1b2c3d4 actor=deepak workflow=CD
          #   This is the Kubernetes audit trail for deployments.
          kubectl annotate deployment/${{ env.DEPLOYMENT_NAME }} \
            kubernetes.io/change-cause="CI/CD: SHA=${SHORT_SHA} actor=${{ github.actor }} run=${{ github.run_number }}" \
            --namespace=${{ env.NAMESPACE }} \
            --overwrite

          echo "Rolling update initiated."

      # ── Step 5: Wait for rolling update to complete ───────────────────────────
      - name: Wait for rollout completion
        id: rollout-status
        run: |
          echo "Waiting for rolling update to complete..."
          echo "Strategy: maxUnavailable=0, maxSurge=1 (from k8s/fastapi/04-deployment.yaml)"
          echo ""
          echo "What Kubernetes is doing:"
          echo "  1. Create 1 new pod with image: ${{ needs.build-and-push.outputs.image }}"
          echo "  2. Wait for new pod to pass readiness probe (/ready on :8000)"
          echo "  3. Terminate 1 old pod (maxUnavailable=0 → no traffic disruption)"
          echo "  4. Repeat until all 2 replicas are updated"
          echo ""

          # WHY --timeout=300s (5 minutes)?
          #   FastAPI starts in ~5 seconds (no model loading).
          #   300 seconds gives ample time even if the node needs to pull the image
          #   (first deployment to a new node: ~60 seconds for image pull).
          #   If rollout doesn't complete in 5 minutes, something is wrong:
          #     • Image pull failure (wrong tag, Artifact Registry auth error)
          #     • Readiness probe failing (app startup bug in new code)
          #     • Resource limits exceeded (OOMKill on startup)
          #   kubectl rollout status exits non-zero on timeout → triggers rollback.
          kubectl rollout status \
            deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

          echo ""
          echo "✅ Rolling update completed successfully."

      # ── Step 6: Auto-rollback on failure ──────────────────────────────────────
      - name: Rollback on failure
        # WHY if: failure() (not if: always())?
       
        if: failure() && steps.rolling-update.outcome == 'success'
        run: |
          echo "⚠️  Deployment failed. Initiating automatic rollback..."
          echo ""
          echo "Current failed state:"
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.DEPLOYMENT_NAME }}
          echo ""

          # WHY kubectl rollout undo?
          #   rollout undo reverts the Deployment to the PREVIOUS revision.
          #   Kubernetes has already stored the previous pod template (old image tag)
          #   in the Deployment's rollout history. undo simply swaps back to it
          #   using the same rolling update strategy (maxUnavailable=0, maxSurge=1).
          #   Zero downtime rollback — old pods come back before new ones are removed.
          kubectl rollout undo \
            deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace=${{ env.NAMESPACE }}

          echo "Waiting for rollback to complete..."
          kubectl rollout status \
            deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

          echo ""
          echo "✅ Rollback completed. Previous version is serving traffic."
          echo "Investigate the failed deployment with:"
          echo "  kubectl describe deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}"
          echo "  kubectl logs -l app=${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --previous"

          # Exit non-zero to mark the workflow run as FAILED even after successful rollback.
          # WHY? A failed deploy that successfully rolled back should still be visible
          # as a failure in the GitHub Actions UI — it should NOT show as green.
          exit 1

      # ── Step 7: Post-deployment verification ──────────────────────────────────
      - name: Verify deployment health
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image-repository }}@${{ needs.build-and-push.outputs.image-digest }}"

          echo "=== Final Pod state ==="
          kubectl get pods \
            -n ${{ env.NAMESPACE }} \
            -l app=${{ env.DEPLOYMENT_NAME }} \
            -o wide

          echo ""
          echo "=== Verify running image matches deployed image ==="
          RUNNING_IMAGE=$(kubectl get deployment ${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo "Expected: ${IMAGE}"
          echo "Running:  ${RUNNING_IMAGE}"

          if [ "${RUNNING_IMAGE}" = "${IMAGE}" ]; then
            echo "✅ Image match confirmed."
          else
            echo "❌ Image mismatch! Deployment may have been overridden."
            exit 1
          fi

          echo ""
          echo "=== Deployment conditions ==="
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} \
            -o jsonpath='{range .status.conditions[*]}{.type}{": "}{.status}{" — "}{.message}{"\n"}{end}'

          echo ""
          echo "=== Updated rollout history ==="
          kubectl rollout history deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }}

      # ── Step 8: Deployment summary ─────────────────────────────────────────────
      - name: Print deployment summary
        if: success()
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          ✅  DEPLOYMENT SUCCESSFUL                       ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  Image:     ${{ needs.build-and-push.outputs.image }}"
          echo "║  Immutable: ${{ needs.build-and-push.outputs.image-repository }}@${{ needs.build-and-push.outputs.image-digest }}"
          echo "║  Digest:    ${{ needs.build-and-push.outputs.image-digest }}"
          echo "║  Commit:    ${{ github.sha }}"
          echo "║  Actor:     ${{ github.actor }}"
          echo "║  Run:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "╚══════════════════════════════════════════════════════════╝"
