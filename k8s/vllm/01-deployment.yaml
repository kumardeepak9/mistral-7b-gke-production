

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: vllm-server
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: mistral-gateway
    app.kubernetes.io/version: "0.6.3"

spec:
  
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 30
  progressDeadlineSeconds: 1800

  selector:
    matchLabels:
      app: vllm

  # ── Update strategy 
  strategy:
    type: RollingUpdate
    rollingUpdate:
     
      maxUnavailable: 1
      maxSurge: 0

  template:
    metadata:
      labels:
        app: vllm
        app.kubernetes.io/name: vllm-server
        app.kubernetes.io/component: inference-engine
        app.kubernetes.io/part-of: mistral-gateway
        app.kubernetes.io/version: "0.6.3"

      annotations:
      
        gke-gcsfuse/volumes: "true"

       
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"

    spec:
      # ── Service Account ────────────
      serviceAccountName: vllm-sa
      automountServiceAccountToken: false
      enableServiceLinks: false

     
      securityContext:
        runAsNonRoot: true
        
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        
        seccompProfile:
          type: RuntimeDefault

    
      nodeSelector:
        cloud.google.com/gke-nodepool: mistral-cluster-gpu-pool
        cloud.google.com/gke-accelerator: nvidia-l4

     
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vllm

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vllm
                topologyKey: kubernetes.io/hostname

     
      terminationGracePeriodSeconds: 120

      
      initContainers:
        - name: model-readiness-check
          image: busybox:1.37.0   
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          command:
            - sh
            - -c
            - |
              echo "Checking model directory: /models/mistral-7b-instruct"
              until [ -f /models/mistral-7b-instruct/config.json ] && \
                    ls /models/mistral-7b-instruct/*.safetensors 1>/dev/null 2>&1; do
                echo "Model files not yet present. Waiting 30 seconds..."
                sleep 30
              done
              echo "Model files verified. Proceeding to start vLLM."
              ls -lh /models/mistral-7b-instruct/

          volumeMounts:
            - name: model-storage
              mountPath: /models
              readOnly: true   

          resources:
            
            requests:
              cpu: "50m"
              memory: "32Mi"
              ephemeral-storage: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"

      # ── Main container ────────────────────────────────────────────────────
      containers:
        - name: vllm

          
          image: vllm/vllm-openai:v0.6.3.post1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8001   # Must match VLLM_BASE_URL port in FastAPI ConfigMap
              protocol: TCP

          
          args:
           
            - "--model"
            - "/models/mistral-7b-instruct"

            
            - "--served-model-name"
            - "mistralai/Mistral-7B-Instruct-v0.3"

            # ── Network ──────────────────────────────────────────────────────
            - "--host"
            - "0.0.0.0"   

            - "--port"
            - "8001"     

            
            - "--gpu-memory-utilization"
            - "0.90"

           
            - "--max-model-len"
            - "4096"

            
            - "--dtype"
            - "auto"

           
            - "--tensor-parallel-size"
            - "1"

            
            - "--disable-log-requests"

            
            - "--uvicorn-log-level"
            - "warning"

          
          env:
           
            - name: CUDA_VISIBLE_DEVICES
              value: "0"

            
            - name: NCCL_P2P_DISABLE
              value: "1"

            
            - name: TRANSFORMERS_CACHE
              value: "/tmp/hf-cache"

            
            - name: HF_HOME
              value: "/tmp/hf-home"

            # Set writable HOME and disable usage stats writing to /.config
            - name: HOME
              value: "/tmp"

            - name: VLLM_NO_USAGE_STATS
              value: "1"

            # Downward API — pod identity for log correlation
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # ── Resource requests and limits ─────────────
          resources:
            requests:
             
              cpu: "4"

           
              memory: "16Gi"
              ephemeral-storage: "2Gi"

            
              nvidia.com/gpu: "1"

            limits:
              cpu: "8"         
              memory: "24Gi"   
              ephemeral-storage: "8Gi"
              
              nvidia.com/gpu: "1"

         
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            
            initialDelaySeconds: 0
            
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3    # 3 × 30s = 90 seconds before restart
            successThreshold: 1

         
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 20      # Check more frequently than liveness
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            
            initialDelaySeconds: 60
            
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 90
            successThreshold: 1

          # ── Container-level security context ──────────────────────────────
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL   

          # ── Volume mounts ──────────────────────────────────────────────────
          volumeMounts:
           
            - name: model-storage
              mountPath: /models
              readOnly: true

           
            - name: shm
              mountPath: /dev/shm

            
            - name: tmp
              mountPath: /tmp

      # ── Volumes ────────────────────────────────────────────────────────────
      volumes:
        
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc    # Created in Phase 5 — Model Provisioning
            readOnly: true

       
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"

        
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: "4Gi"
