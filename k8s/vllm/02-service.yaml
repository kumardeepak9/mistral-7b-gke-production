

apiVersion: v1
kind: Service
metadata:
  
  name: vllm-service
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: vllm-server
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: mistral-gateway

  annotations:
    
    cloud.google.com/neg: '{"ingress": true}'

spec:
  type: ClusterIP

  
  selector:
    app: vllm

  # ── Ports ──────────────────────
  ports:
    - name: http

     
      port: 8001
      targetPort: http    
      protocol: TCP

  
  sessionAffinity: None
