

apiVersion: policy/v1      # PDB moved from policy/v1beta1 to policy/v1 in K8s 1.21+
kind: PodDisruptionBudget
metadata:
  name: vllm-pdb
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: vllm-server
    app.kubernetes.io/component: pdb
    app.kubernetes.io/part-of: mistral-gateway

spec:
  
  minAvailable: 1

  
  selector:
    matchLabels:
      app: vllm
