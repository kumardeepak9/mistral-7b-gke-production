# =============================================================================
# k8s/vllm/00-serviceaccount.yaml
#
# WHY a separate ServiceAccount for vLLM?
#   vLLM pods have fundamentally different GCP permissions than FastAPI pods:
#
#   FastAPI SA  → needs: Cloud Logging write, Cloud Trace write
#   vLLM SA     → needs: Cloud Logging write, Cloud Trace write,
#                         GCS read access to the model bucket (Diagram 2)
#
#   Workload Identity maps this Kubernetes SA to a GCP Service Account (GSA)
#   that has `roles/storage.objectViewer` on the model bucket.
#   This allows vLLM pods to read model weights from GCS without any
#   long-lived JSON key files inside the container — the GKE metadata server
#   issues short-lived OIDC tokens automatically.
#
# GCS Fuse CSI Driver (Phase 5 — Model Provisioning):
#   When we create the GCS Fuse CSI PersistentVolume, it will authenticate
#   using this ServiceAccount's Workload Identity binding to mount the
#   GCS bucket containing the Mistral-7B model weights as a local directory.
#
# Setup commands (run once per project, Phase 5):
#   gcloud iam service-accounts create vllm-gsa \
#     --project=PROJECT_ID \
#     --display-name="vLLM GCS Reader"
#
#   gcloud storage buckets add-iam-policy-binding gs://mistral-model-bucket \
#     --member="serviceAccount:vllm-gsa@PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/storage.objectViewer"
#
#   gcloud iam service-accounts add-iam-policy-binding \
#     vllm-gsa@PROJECT_ID.iam.gserviceaccount.com \
#     --role="roles/iam.workloadIdentityUser" \
#     --member="serviceAccount:PROJECT_ID.svc.id.goog[mistral-gateway/vllm-sa]"
#
# COMMAND: kubectl apply -f k8s/vllm/00-serviceaccount.yaml
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-sa                  # Referenced in Deployment.spec.serviceAccountName
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: vllm-server
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: mistral-gateway

  annotations:
    # Workload Identity binding — maps this K8s SA to the GCP SA.
    # Replace PROJECT_ID with your GCP project ID.
    # The GSA must have roles/storage.objectViewer on the model GCS bucket.
    iam.gke.io/gcp-service-account: "vllm-gsa@PROJECT_ID.iam.gserviceaccount.com"

# WHY automountServiceAccountToken: false?
#   vLLM does not call the Kubernetes API. The SA token is not needed.
#   Disabling it reduces the blast radius of a container compromise.
#   Workload Identity uses a separate GKE metadata server mechanism,
#   not this token, so GCS access still works.
automountServiceAccountToken: false
