

swagger: "2.0"    

info:
  title: "Mistral-7B Inference API"
  description: |
    Production inference gateway for Mistral-7B-Instruct-v0.3.
    OpenAI-compatible API hosted on GKE with vLLM backend.
    Requires a valid API key in the x-api-key header or as a query parameter.
  version: "0.1.0"
  contact:
    name: "Platform Team"
    email: "platform@example.com"
  license:
    name: "Apache 2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0"


host: "mistral-gateway.apigateway.project-d9f9eda6-2e99-4916-a87.cloud.goog"
basePath: "/"
schemes:
  - https   


securityDefinitions:
  api_key:
    type: "apiKey"
    name: "x-api-key"   
    in: "header"        

# Apply API key requirement to ALL paths by default
security:
  - api_key: []


x-google-backend:
  address: "https://INGRESS_EXTERNAL_IP"
  protocol: h2
  
  path_translation: APPEND_PATH_TO_ADDRESS
  

# ── API paths ─────────────────────────────────────────────────────────────────
paths:

  # ── Root ─────────────────────────────────────────────────────────────────────
  /:
    get:
      operationId: "getRoot"
      summary: "API information"
      description: "Returns API name, version, and available endpoint documentation."
      tags:
        - info
      produces:
        - "application/json"
      responses:
        200:
          description: "API information"
          schema:
            type: object
            properties:
              name:
                type: string
                example: "Mistral-7B Inference Gateway"
              version:
                type: string
                example: "0.1.0"

  # ── Health check ─────────────────────────────────────────────────────────────
  /health:
    get:
      operationId: "healthCheck"
      summary: "Liveness health check"
      description: "Returns 200 if the FastAPI application is running."
      tags:
        - monitoring
      security: []    
      produces:
        - "application/json"
      responses:
        200:
          description: "Service is healthy"
          schema:
            type: object
            properties:
              status:
                type: string
                example: "healthy"

  # ── Readiness check ────────────────────────────────────────────────────────
  /ready:
    get:
      operationId: "readinessCheck"
      summary: "Readiness check — includes vLLM backend connectivity"
      description: "Returns 200 only when FastAPI can reach the vLLM backend."
      tags:
        - monitoring
      security: []    # No API key — same reason as /health
      produces:
        - "application/json"
      responses:
        200:
          description: "Service is ready to handle requests"
        503:
          description: "Service not ready (vLLM backend unreachable)"

  # ── List models ───────────────────────────────────────────────────────────────
  /v1/models:
    get:
      operationId: "listModels"
      summary: "List available models"
      description: "Returns the list of models available for inference (OpenAI-compatible)."
      tags:
        - inference
      security:
        - api_key: []
      produces:
        - "application/json"
      responses:
        200:
          description: "List of available models"
          schema:
            type: object
            properties:
              object:
                type: string
                example: "list"
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "mistralai/Mistral-7B-Instruct-v0.3"
        401:
          description: "Invalid or missing API key"
        429:
          description: "Rate limit exceeded (Cloud Armor or API Gateway quota)"

  # ── Chat completions ──────────────────────────────────────────────────────────
  /v1/chat/completions:
    post:
      operationId: "createChatCompletion"
      summary: "Create a chat completion"
      description: |
        OpenAI-compatible chat completions endpoint.
        Proxied to vLLM running Mistral-7B-Instruct-v0.3.
        Maximum response time: 120 seconds (VLLM_TIMEOUT_SECONDS).
      tags:
        - inference
      security:
        - api_key: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - model
              - messages
            properties:
              model:
                type: string
                description: "Must be 'mistralai/Mistral-7B-Instruct-v0.3'"
                example: "mistralai/Mistral-7B-Instruct-v0.3"
              messages:
                type: array
                description: "Conversation history in OpenAI message format"
                items:
                  type: object
                  required:
                    - role
                    - content
                  properties:
                    role:
                      type: string
                      enum: [system, user, assistant]
                    content:
                      type: string
              max_tokens:
                type: integer
                description: "Max tokens to generate. Ceiling enforced by FastAPI: 4096."
                default: 512
                minimum: 1
                maximum: 4096
              temperature:
                type: number
                description: "Sampling temperature. 0 = deterministic."
                default: 0.7
                minimum: 0
                maximum: 2
              stream:
                type: boolean
                description: "If true, response is streamed as Server-Sent Events."
                default: false
      responses:
        200:
          description: "Chat completion response"
          schema:
            type: object
            properties:
              id:
                type: string
              object:
                type: string
                example: "chat.completion"
              created:
                type: integer
              model:
                type: string
              choices:
                type: array
                items:
                  type: object
                  properties:
                    index:
                      type: integer
                    message:
                      type: object
                    finish_reason:
                      type: string
              usage:
                type: object
                properties:
                  prompt_tokens:
                    type: integer
                  completion_tokens:
                    type: integer
                  total_tokens:
                    type: integer
        400:
          description: "Bad request (missing required fields, max_tokens exceeded ceiling)"
        401:
          description: "Invalid or missing API key"
        429:
          description: "Rate limit exceeded — try again after the Retry-After header interval"
        504:
          description: "Gateway timeout — vLLM inference exceeded 120 seconds"
