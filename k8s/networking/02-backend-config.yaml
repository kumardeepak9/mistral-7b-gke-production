

apiVersion: cloud.google.com/v1    
kind: BackendConfig
metadata:
  name: fastapi-backend-config      
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: mistral-inference-gateway
    app.kubernetes.io/component: backend-config
    app.kubernetes.io/part-of: mistral-gateway

spec:
 
  securityPolicy:
    name: mistral-cloud-armor-policy

  
  timeoutSec: 135

 
  
  connectionDraining:
    drainingTimeoutSec: 30

  
  healthCheck:
    checkIntervalSec: 15       
    timeoutSec: 10             
    healthyThreshold: 1        
    unhealthyThreshold: 3      
    type: HTTP
    requestPath: /health       
    port: 8000                 

  

  logging:
    enable: true
    sampleRate: 0.1
