# =============================================================================
# k8s/model-provisioning/01-secret.yaml
#
# WHY is an HF_TOKEN needed?
#   Mistral-7B-Instruct-v0.3 is a GATED MODEL on Hugging Face.
#   "Gated" means the model owner requires users to:
#     1. Log in to huggingface.co
#     2. Accept the model's license agreement
#     3. Obtain an access token (HF_TOKEN)
#
#   Without a valid token, the Hugging Face Hub API returns HTTP 401.
#   The download Job would fail immediately before any data is transferred.
#
#   To obtain a token:
#     1. Go to https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.3
#     2. Accept the license agreement
#     3. Go to https://huggingface.co/settings/tokens
#     4. Create a token with "Read" scope
#     5. Base64 encode it: echo -n "hf_your_token_here" | base64
#
# WHY Secret and not ConfigMap?
#   The HF token grants access to download proprietary models. If leaked:
#     • An attacker can download gated models under your account
#     • Your Hugging Face account may be suspended for ToS violations
#     • Rate limits consume your quota
#   Kubernetes Secrets are stored separately from ConfigMaps in etcd,
#   with RBAC rules that can restrict who can read them.
#
# PRODUCTION PRACTICE:
#   Store the real token in GCP Secret Manager and sync via External Secrets
#   Operator. This Secret contains a PLACEHOLDER — replace before running.
#
#   echo -n "hf_your_actual_token" | base64
#
# COMMAND: kubectl apply -f k8s/model-provisioning/01-secret.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: hf-token-secret          # Referenced in Job.spec.containers[].env
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: model-provisioning
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: mistral-gateway

  annotations:
    # This Secret is ONE-TIME USE — only needed while the download Job runs.
    # After the model is uploaded to GCS, this Secret can be deleted:
    #   kubectl delete secret hf-token-secret -n mistral-gateway
    # The vLLM Deployment reads from GCS directly and does not need HF_TOKEN.
    secret-management: "gcp-secret-manager"
    secret-manager-path: "projects/PROJECT_ID/secrets/huggingface-token"
    lifecycle: "ephemeral"

type: Opaque

data:
  # PLACEHOLDER — replace with your actual base64-encoded HuggingFace token.
  # Generate with: echo -n "hf_your_actual_token_here" | base64
  # The Job container reads this as the HF_TOKEN environment variable.
  HF_TOKEN: "aGZfeW91cl90b2tlbl9oZXJl"   # placeholder: "hf_your_token_here"
