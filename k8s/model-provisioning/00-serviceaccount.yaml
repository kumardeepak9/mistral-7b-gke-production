# =============================================================================
# k8s/model-provisioning/00-serviceaccount.yaml
#
# WHY a SEPARATE ServiceAccount for the download Job?
#   The Job needs fundamentally different GCP permissions than vLLM pods:
#
#   vLLM SA (vllm-sa):          roles/storage.objectViewer  → READ model files
#   Download Job SA (here):     roles/storage.objectAdmin   → WRITE model files
#
#   Principle of Least Privilege: never give vLLM pods write access to the
#   model bucket. If a vLLM pod is compromised, an attacker cannot overwrite
#   or delete model weights. The Job SA is only active during provisioning.
#
# PERMISSIONS REQUIRED:
#   1. roles/storage.objectAdmin  → create, overwrite, delete objects in bucket
#      (needed to upload model files from Hugging Face to GCS)
#
#   2. roles/storage.legacyBucketReader  → list bucket contents
#      (needed to verify upload completion)
#
# GCP SETUP (run once, before applying this manifest):
#
#   # 1. Create the GCP Service Account for the download Job
#   gcloud iam service-accounts create model-download-gsa \
#     --project=PROJECT_ID \
#     --display-name="Mistral Model Download Job GSA"
#
#   # 2. Grant object admin on the model bucket
#   gcloud storage buckets add-iam-policy-binding gs://PROJECT_ID-mistral-models \
#     --member="serviceAccount:model-download-gsa@PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/storage.objectAdmin"
#
#   # 3. Bind the Kubernetes SA to the GCP SA via Workload Identity
#   gcloud iam service-accounts add-iam-policy-binding \
#     model-download-gsa@PROJECT_ID.iam.gserviceaccount.com \
#     --role="roles/iam.workloadIdentityUser" \
#     --member="serviceAccount:PROJECT_ID.svc.id.goog[mistral-gateway/model-download-sa]"
#
# COMMAND: kubectl apply -f k8s/model-provisioning/00-serviceaccount.yaml
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-download-sa        # Referenced in Job.spec.serviceAccountName
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: model-provisioning
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: mistral-gateway

  annotations:
    # Workload Identity — maps this K8s SA to the GCP SA with GCS write access.
    # Replace PROJECT_ID with your actual GCP project ID.
    # The GKE metadata server uses this annotation to issue OIDC tokens
    # when the Job pod requests GCP credentials — no JSON key file needed.
    iam.gke.io/gcp-service-account: "model-download-gsa@PROJECT_ID.iam.gserviceaccount.com"

# WHY automountServiceAccountToken: false?
#   The Job does not call the Kubernetes API.
#   GCS access is via Workload Identity (GKE metadata server), not this token.
#   Disabling it follows the principle of least privilege.
automountServiceAccountToken: false
