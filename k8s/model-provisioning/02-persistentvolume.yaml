

apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-gcs-pv             

  labels:
    app.kubernetes.io/name: model-provisioning
    app.kubernetes.io/component: persistentvolume
    app.kubernetes.io/part-of: mistral-gateway
    model: mistral-7b-instruct-v0.3

spec:
  
  capacity:
    storage: 50Gi

  
  accessModes:
    - ReadOnlyMany

 
  persistentVolumeReclaimPolicy: Retain

  
  storageClassName: ""

  
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: model-pvc               
    namespace: mistral-gateway    

  
  csi:
    
    driver: gcsfuse.csi.storage.gke.io

    
    volumeHandle: "project-d9f9eda6-2e99-4916-a87-mistral-models"

 
    readOnly: true

    volumeAttributes:
     
      mountOptions: "implicit-dirs"

     
      gcsfuseLoggingSeverity: warning

     
      fileCacheCapacity: "2Gi"

    
      metadataCacheTtlSeconds: "86400"
