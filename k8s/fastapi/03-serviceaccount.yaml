# =============================================================================
# k8s/fastapi/03-serviceaccount.yaml
#
# WHY a ServiceAccount?
#   Every pod in Kubernetes runs as a ServiceAccount. If you don't specify one,
#   Kubernetes uses the "default" account in the namespace — which is a security
#   anti-pattern because:
#     • The default SA may have RBAC permissions granted by other workloads.
#     • You cannot apply Workload Identity to the default SA selectively.
#
#   A dedicated ServiceAccount gives us:
#     1. Principle of least privilege — this SA has no permissions by default.
#        We grant only what the FastAPI pods need (Phase 4: GCP logging, tracing).
#     2. GKE Workload Identity — maps this Kubernetes SA to a GCP Service Account,
#        allowing pods to call GCP APIs (Cloud Logging, Secret Manager) without
#        a long-lived JSON key file in the container.
#        Annotation format: iam.gke.io/gcp-service-account=<gsa>@<project>.iam.gserviceaccount.com
#     3. Audit trail — CloudAudit logs show which SA made which GCP API call.
#
# COMMAND: kubectl apply -f k8s/fastapi/03-serviceaccount.yaml
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-sa               # Referenced in Deployment.spec.serviceAccountName
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: mistral-inference-gateway
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: mistral-gateway

  annotations:
    # GKE Workload Identity binding.
    # Replace PROJECT_ID with your GCP project ID.
    # The GCP Service Account (GSA) must be created in Phase 4 (Terraform):
    #   gcloud iam service-accounts create fastapi-gsa --project=PROJECT_ID
    #   gcloud iam service-accounts add-iam-policy-binding fastapi-gsa@PROJECT_ID.iam.gserviceaccount.com \
    #     --role roles/iam.workloadIdentityUser \
    #     --member "serviceAccount:PROJECT_ID.svc.id.goog[mistral-gateway/fastapi-sa]"
    iam.gke.io/gcp-service-account: "fastapi-gsa@PROJECT_ID.iam.gserviceaccount.com"

# WHY automountServiceAccountToken: false?
#   By default, Kubernetes mounts the SA's JWT token into every pod at
#   /var/run/secrets/kubernetes.io/serviceaccount/token.
#   The FastAPI app does not make Kubernetes API calls, so it does not need
#   this token. Disabling it:
#     • Reduces the blast radius if the container is compromised (no K8s API token)
#     • Satisfies CIS Benchmark 5.1.6: "Ensure that default service accounts
#       are not bound to active service account roles"
#
# NOTE: Workload Identity uses a different mechanism (metadata server, not this
# token), so disabling automount does not break GCP API authentication.
automountServiceAccountToken: false
