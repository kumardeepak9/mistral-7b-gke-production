

apiVersion: v1
kind: Service
metadata:
  name: fastapi-service          
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: mistral-inference-gateway
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: mistral-gateway

  annotations:
    
    cloud.google.com/neg: '{"ingress": true}'

    
    cloud.google.com/backend-config: '{"ports": {"80": "fastapi-backend-config"}}'

spec:
 
  type: ClusterIP

 
  selector:
    app: fastapi          

  # ── Ports ───
  ports:
    - name: http           

      
      port: 80

     
      targetPort: http

      protocol: TCP

 
  sessionAffinity: None
