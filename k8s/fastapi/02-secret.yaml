# =============================================================================
# k8s/fastapi/02-secret.yaml
#
# WHY Secret and not ConfigMap?
#   Kubernetes Secrets are base64-encoded (NOT encrypted by default), but:
#   • They are excluded from `kubectl describe pod` output (values are masked)
#   • They can be encrypted at rest with GKE's CMEK (Customer-Managed Encryption)
#   • They are stored separately from ConfigMaps in etcd, enabling finer RBAC:
#     a developer can read ConfigMaps but not Secrets.
#   • External Secrets Operator (ESO) can sync them from GCP Secret Manager —
#     so the actual secret value never lives in Git.
#
# ⚠️  IMPORTANT — PRODUCTION PRACTICE:
#   This file contains PLACEHOLDER base64 values.
#   In production, this manifest is NOT committed with real values.
#   Real secrets are managed by one of:
#     1. GCP Secret Manager + External Secrets Operator (ESO) — recommended
#     2. GCP Secret Manager + Config Connector
#     3. Sealed Secrets (Bitnami) for GitOps
#
#   The base64 values here are generated with:
#     echo -n "your-actual-value" | base64
#
#   Decode for verification:
#     echo "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=" | base64 --decode
#
# HOW it connects to the app:
#   The Deployment mounts this Secret as environment variables via secretRef.
#   pydantic-settings in app/config.py reads them transparently.
#
# COMMAND: kubectl apply -f k8s/fastapi/02-secret.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: fastapi-secrets          # Referenced in Deployment.spec.containers[].envFrom
  namespace: mistral-gateway

  labels:
    app.kubernetes.io/name: mistral-inference-gateway
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: mistral-gateway

  annotations:
    # Documents that the real value is managed externally, not in this file.
    # This annotation is informational — it does not trigger any automation.
    # In Phase 5, this will be replaced by an ExternalSecret object that syncs
    # automatically from GCP Secret Manager.
    secret-management: "gcp-secret-manager"
    secret-manager-path: "projects/PROJECT_ID/secrets/fastapi-gateway-key"

# WHY type: Opaque?
#   Kubernetes has typed secrets (kubernetes.io/tls, kubernetes.io/dockerconfigjson, etc.)
#   for structured data. "Opaque" is the generic type for arbitrary key-value pairs —
#   correct for application secrets like API keys.
type: Opaque

# WHY `data` not `stringData`?
#   `data` values must be base64-encoded. `stringData` accepts plaintext but
#   Kubernetes base64-encodes it before storing — making diffs noisy in GitOps.
#   We use `data` with explicit base64 to keep the manifest deterministic.
#
# Base64 encoding (these are PLACEHOLDERS — replace before deploying):
#   GATEWAY_API_KEY  →  echo -n "change-me-in-production" | base64
data:
  # A gateway-level API key that downstream clients (e.g., your frontend or
  # internal services) present to authenticate to the FastAPI gateway.
  # FastAPI middleware will validate this key in Phase 4 (auth layer).
  # Placeholder: "change-me-in-production"
  GATEWAY_API_KEY: "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24="

  # Optional: vLLM API key if the vLLM server is configured with --api-key.
  # Leave empty ("") if vLLM is running without authentication (cluster-internal
  # traffic only, protected by NetworkPolicy).
  # Placeholder: "change-me-in-production"
  VLLM_API_KEY: "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24="
