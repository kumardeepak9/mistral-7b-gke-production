

apiVersion: apps/v1       
kind: Deployment
metadata:
  name: fastapi             
  namespace: mistral-gateway

  labels:
   
    app.kubernetes.io/name: mistral-inference-gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: mistral-gateway
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: kubectl   

spec:
  
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600

  
  selector:
    matchLabels:
      app: fastapi                  

  
  strategy:
    type: RollingUpdate             
    rollingUpdate:
      
      maxUnavailable: 0

     
      maxSurge: 1

 
  template:
    metadata:
      labels:
        
        app: fastapi
        app.kubernetes.io/name: mistral-inference-gateway
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/part-of: mistral-gateway
        app.kubernetes.io/version: "0.1.0"

      annotations:
        
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"

    spec:
     
      serviceAccountName: fastapi-sa

      
      automountServiceAccountToken: false
      enableServiceLinks: false

     
      securityContext:
       
        runAsNonRoot: true

        
        runAsUser: 1001
        runAsGroup: 1001

       
        fsGroup: 1001

       
        seccompProfile:
          type: RuntimeDefault

      
      topologySpreadConstraints:
        - maxSkew: 1                          
          topologyKey: topology.kubernetes.io/zone   
          whenUnsatisfiable: DoNotSchedule    
          labelSelector:
            matchLabels:
              app: fastapi                  

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: fastapi
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: fastapi
                topologyKey: topology.kubernetes.io/zone

     
      terminationGracePeriodSeconds: 30

      # ── Containers ──────────────────────────────────────────────────────────
      containers:
        - name: fastapi   

         
          image: europe-west4-docker.pkg.dev/project-d9f9eda6-2e99-4916-a87/mistral-registry/mistral-inference-gateway:0.1.1

        
          imagePullPolicy: IfNotPresent

          # ── Container port ────────────────────────────────────────────────────
          ports:
            - name: http              
              containerPort: 8000     
              protocol: TCP

         
          envFrom:
            - configMapRef:
                name: fastapi-config       
            - secretRef:
                name: fastapi-secrets       

          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name          

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace      

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName          

            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP           

          
          resources:
            requests:
              cpu: "250m"       
              memory: "256Mi"   
              ephemeral-storage: "256Mi"
            limits:
              cpu: "1000m"      
              memory: "512Mi"   
              ephemeral-storage: "512Mi"

         
          livenessProbe:
            httpGet:
              path: /health
              port: http            
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

         
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

         
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5          
            timeoutSeconds: 5
            failureThreshold: 12      
            successThreshold: 1

         
          securityContext:
            
            allowPrivilegeEscalation: false

           
            readOnlyRootFilesystem: true

            
            capabilities:
              drop:
                - ALL

          
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: var-tmp-volume
              mountPath: /var/tmp

      
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: "64Mi"    

        - name: var-tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: "16Mi"    
