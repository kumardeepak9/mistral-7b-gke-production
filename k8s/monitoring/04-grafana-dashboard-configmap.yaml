apiVersion: v1
kind: ConfigMap
metadata:
  name: mistral-inference-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: mistral-monitoring
data:
  mistral-inference-system.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "System Overview & Health Status",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "text": "DOWN" } }, "type": "value" },
                { "options": { "from": 1, "result": { "color": "green", "text": "HEALTHY" }, "to": 10 }, "type": "range" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "FastAPI Gateway Status",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"mistral-gateway\", pod=~\"fastapi-.*\", condition=\"true\"})",
              "legendFormat": "FastAPI Ready Pods"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "text": "DOWN" } }, "type": "value" },
                { "options": { "from": 1, "result": { "color": "green", "text": "HEALTHY" }, "to": 10 }, "type": "range" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "vLLM Inference Server",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"mistral-gateway\", pod=~\"vllm-.*\", condition=\"true\"})",
              "legendFormat": "vLLM Ready Pods"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 5, "x": 8, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Model Information",
          "type": "stat",
          "targets": [
            {
              "expr": "count by (model_name) (vllm:e2e_request_latency_seconds_count) or vector(1)",
              "legendFormat": "Mistral-7B-Instruct-v0.3"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 15 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 3, "x": 13, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Active Requests",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(http_requests_in_progress{namespace=\"mistral-gateway\"}) or vector(0)",
              "legendFormat": "In-flight"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 2 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Running / Waiting Requests",
          "type": "stat",
          "targets": [
            {
              "expr": "vllm:num_requests_running or vector(0)",
              "legendFormat": "Running"
            },
            {
              "expr": "vllm:num_requests_waiting or vector(0)",
              "legendFormat": "Waiting"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 6,
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "title": "GPU Utilization",
          "type": "gauge",
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_UTIL or vector(0)",
              "legendFormat": "GPU %"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 200,
          "title": "FastAPI Gateway Performance",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 6 },
          "id": 7,
          "title": "FastAPI Request Rate (req/s)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (handler, status) (rate(http_requests_total{namespace=~\"$namespace\"}[1m]))",
              "legendFormat": "{{handler}} [{{status}}]"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 6 },
          "id": 8,
          "title": "FastAPI Request Latency (p50 / p95 / p99)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[2m])))",
              "legendFormat": "p50 Latency"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[2m])))",
              "legendFormat": "p95 Latency"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[2m])))",
              "legendFormat": "p99 Latency"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 50,
                "lineWidth": 1
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 6 },
          "id": 9,
          "title": "HTTP 4xx & 5xx Errors",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (status, handler) (rate(http_requests_total{namespace=~\"$namespace\", status=~\"4..\"}[1m]))",
              "legendFormat": "4xx: {{handler}} [{{status}}]"
            },
            {
              "expr": "sum by (status, handler) (rate(http_requests_total{namespace=~\"$namespace\", status=~\"5..\"}[1m]))",
              "legendFormat": "5xx: {{handler}} [{{status}}]"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 300,
          "title": "vLLM LLM Inference & Token Metrics",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 15 },
          "id": 10,
          "title": "vLLM Inference Request Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(vllm:e2e_request_latency_seconds_count[1m]))",
              "legendFormat": "Inference Requests/sec"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 15 },
          "id": 11,
          "title": "vLLM Inference Latency (e2e, TTFT, TPOT)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket[2m])))",
              "legendFormat": "e2e Latency p95"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[2m])))",
              "legendFormat": "TTFT p95 (Time to 1st Token)"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:time_per_output_token_seconds_bucket[2m])))",
              "legendFormat": "TPOT p95 (Time per Output Token)"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "tokens/s"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 15 },
          "id": 12,
          "title": "Prompt & Generation Tokens / sec",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(vllm:prompt_tokens_total[1m]))",
              "legendFormat": "Prompt Tokens/s"
            },
            {
              "expr": "sum(rate(vllm:generation_tokens_total[1m]))",
              "legendFormat": "Generation Tokens/s"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short"
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 23 },
          "id": 13,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Total Prompt Tokens Processed",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(vllm:prompt_tokens_total) or vector(0)",
              "legendFormat": "Prompt Tokens"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short"
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 23 },
          "id": 14,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Total Generated Tokens",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(vllm:generation_tokens_total) or vector(0)",
              "legendFormat": "Generated Tokens"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "fillOpacity": 15
              }
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 23 },
          "id": 15,
          "title": "vLLM Request Queues (Running vs Waiting)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "vllm:num_requests_running",
              "legendFormat": "Running Requests"
            },
            {
              "expr": "vllm:num_requests_waiting",
              "legendFormat": "Waiting Requests"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 29 },
          "id": 400,
          "title": "NVIDIA GPU Hardware & VRAM Telemetry",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20
              },
              "max": 100,
              "min": 0,
              "unit": "percent"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 30 },
          "id": 16,
          "title": "NVIDIA GPU Utilization %",
          "type": "timeseries",
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_UTIL{gpu=~\"$gpu\"}",
              "legendFormat": "GPU {{gpu}} (Node: {{node}})"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20
              },
              "max": 100,
              "min": 0,
              "unit": "percent"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 30 },
          "id": 17,
          "title": "GPU Memory Copy / Bandwidth Utilization %",
          "type": "timeseries",
          "targets": [
            {
              "expr": "DCGM_FI_DEV_MEM_COPY_UTIL{gpu=~\"$gpu\"}",
              "legendFormat": "Memory Copy Util {{gpu}}"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 30 },
          "id": 18,
          "title": "GPU VRAM Used vs Total",
          "type": "timeseries",
          "targets": [
            {
              "expr": "DCGM_FI_DEV_FB_USED{gpu=~\"$gpu\"} * 1048576",
              "legendFormat": "VRAM Used"
            },
            {
              "expr": "(DCGM_FI_DEV_FB_USED{gpu=~\"$gpu\"} + DCGM_FI_DEV_FB_FREE{gpu=~\"$gpu\"}) * 1048576",
              "legendFormat": "VRAM Total"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              },
              "unit": "celsius"
            }
          },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 38 },
          "id": 19,
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "title": "GPU Temperature (°C)",
          "type": "gauge",
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_TEMP{gpu=~\"$gpu\"}",
              "legendFormat": "Temp °C"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
