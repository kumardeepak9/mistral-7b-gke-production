          },
          "gridPos": { "h": 6, "w": 10, "x": 6, "y": 38 },
          "id": 20,
          "title": "GPU Power Draw (Watts)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "DCGM_FI_DEV_POWER_USAGE{gpu=~\"$gpu\"}",
              "legendFormat": "Power Draw (W)"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 38 },
          "id": 21,
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
