# ─────────────────────────────────────────────────────────────────────────────
# k8s/monitoring/values.yaml
# Production values for kube-prometheus-stack Helm release
# ─────────────────────────────────────────────────────────────────────────────

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryWorkingSetBytes: true
    k8sPodCrashLooping: true
    k8sPodNotReady: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# ── Prometheus Server ─────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    retentionSize: 8GB
    enableAdminAPI: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: monitoring-standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
      runAsGroup: 2000
      fsGroup: 2000

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 120h
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: monitoring-standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "admin"
  persistence:
    enabled: true
    storageClassName: monitoring-standard
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folder: "/tmp/dashboards"
      defaultFolderName: "Mistral Platform"
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  grafana.ini:
    auth.anonymous:
      enabled: false
    security:
      allow_embedding: false

# ── Exporters ─────────────────────────────────────────────────────────────────
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

prometheus-node-exporter:
  tolerations:
    - effect: NoSchedule
      operator: Exists
